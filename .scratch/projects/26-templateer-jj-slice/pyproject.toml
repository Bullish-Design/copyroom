[project]
name = "copyroom-local-slice"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["templateer==0.4.1"]

[tool.uv.sources]
templateer = { path = "../../../../templateer_v2", editable = true }

[dependency-groups]
dev = ["ruff>=0.3"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
