[project]
name = "copyroom"
version = "0.7.7"
description = "Mode-aware CLI for local Templateer and jj project workflows."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
  { name = "Bullish Design", email = "BullishDesignEngineering@gmail.com" },
]

dependencies = [
  "pydantic>=2.12.5",
  "pyjutsu==0.23.0",
  "pyyaml>=6.0",
  "templateer==0.4.1",
  "tomlkit>=0.13",
  "typer>=0.12",
]

[project.scripts]
copyroom = "copyroom.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.1",
  "ruff>=0.5.0",
  "hypothesis>=6.0",
]

#[project.urls]
#homepage = "https://github.com/Bullish-Design/template-py"
#repository = "https://github.com/Bullish-Design/template-py.git"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copyroom"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "README.md",
  "docs",
  "tests",
  "pyproject.toml",
]

[tool.uv]
# Keep the default behavior; this section is here so you can extend it later if needed.

[tool.uv.sources]
# CopyRoom uses the maintained local Templateer checkout in this workspace.
templateer = { path = "../templateer_v2", editable = true }
# pyjutsu is not on PyPI. This release wheel needs Linux x86-64 with glibc 2.39 or later.
# Other platforms build the sdist from the same release with Rust 1.89 or later.
pyjutsu = { url = "https://github.com/Bullish-Design/Pyjutsu/releases/download/v0.23.0/pyjutsu-0.23.0-cp313-abi3-manylinux_2_39_x86_64.whl" }

[tool.pytest.ini_options]
addopts = "-q --cov=copyroom --cov-report=term-missing -m 'not slow'"
testpaths = ["tests"]
markers = ["slow: long-running process and recovery checks"]

[tool.ty]
src = { include = ["tests/**"] }

[tool.ty.environment]
root = ["src"]
extra-paths = ["tests"]
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = false

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"src/copyroom/_compat/**" = ["D", "ANN"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = []

[tool.ruff.lint.flake8-bugbear]
# Typer's idiom is to call Argument()/Option() in parameter defaults (B008).
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "hypothesis>=6.155.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]
